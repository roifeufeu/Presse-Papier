
name: Nettoyage automatique SynCli

on:
  schedule:
    - cron: "17 4 * * *"

  workflow_dispatch:

permissions: {}

concurrency:
  group: syncli-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Supprimer les éléments expirés
        env:
          CLEANUP_SECRET: ${{ secrets.CLEANUP_SECRET }}
        run: |
          if [ -z "$CLEANUP_SECRET" ]; then
            echo "Secret CLEANUP_SECRET manquant"
            exit 1
          fi

          curl --fail-with-body \
            --silent --show-error \
            --retry 2 \
            --max-time 120 \
            -X POST \
            -H "x-cleanup-secret: $CLEANUP_SECRET" \
            https://presse-papier-production.up.railway.app/maintenance/cleanup-expired
